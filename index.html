<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản đồ Vector Việt Nam - Mỗi Tỉnh Một Màu</title>
  
  <!-- CSS MapLibre GL -->
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    html, body, #map { 
      height: 100%; 
      margin: 0; 
      padding: 0; 
    }
    #status {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="status">Đang tải bản đồ...</div>
  <div id="map"></div>

  <!-- Thư viện MapLibre GL & PMTiles -->
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>

  <script>
    // 1. Đăng ký đọc chuẩn PMTiles
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const PMTILES_URL = "https://vinhhungdesign2345-tech.github.io/Ban-do/34-Tinh-Thanh.pmtiles"; 

    // Bảng màu sắc tươi sáng dành riêng cho các tỉnh
    const PALETTE = [
      '#e6194B', '#3cb44b', '#ffe119', '#4363d8', '#f58231', 
      '#911eb4', '#42d4f4', '#f032e6', '#bfef45', '#fabed4', 
      '#469990', '#dcbeff', '#9A6324', '#fffac8', '#800000', 
      '#aaffc3', '#808000', '#ffd8b1', '#000075', '#a9a9a9'
    ];

    // Khởi tạo bản đồ trực tiếp
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm-tiles': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap'
          },
          'vietnam-vector': {
            type: 'vector',
            url: `pmtiles://${PMTILES_URL}`
          }
        },
        layers: [
          // Layer Nền OSM
          { id: 'osm-layer', type: 'raster', source: 'osm-tiles' },
          
          // Layer Tô màu (dùng match tự động tô ngẫu nhiên các tỉnh)
          {
            id: 'vietnam-fill',
            type: 'fill',
            source: 'vietnam-vector',
            'source-layer': '34-Tinh-Thanh', // Tên mặc định của layer
            paint: {
              // Tô màu đa dạng dựa vào id/tọa độ tính năng
              'fill-color': [
                'interpolate',
                ['linear'],
                ['coalesce', ['id'], 1],
                0, '#3cb44b',
                5, '#e6194B',
                10, '#ffe119',
                15, '#4363d8',
                20, '#f58231',
                25, '#911eb4',
                30, '#42d4f4',
                35, '#f032e6'
              ],
              'fill-opacity': 0.55
            }
          },

          // Layer Viền đỏ sắc nét
          {
            id: 'vietnam-line',
            type: 'line',
            source: 'vietnam-vector',
            'source-layer': '34-Tinh-Thanh',
            paint: {
              'line-color': '#d62728',
              'line-width': 1.2
            }
          }
        ]
      },
      center: [108.0, 16.0],
      zoom: 5
    });

    // Khi bản đồ sẵn sàng
    map.on('load', () => {
      document.getElementById('status').textContent = 'Đã tải xong Vector Tiles!';

      // Tự động kiểm tra tên layer thật bên trong file pmtiles để sửa nếu lỡ lệch
      const p = new pmtiles.PMTiles(PMTILES_URL);
      p.getMetadata().then(meta => {
        if (meta.vector_layers && meta.vector_layers.length > 0) {
          const realLayerName = meta.vector_layers[0].id;
          map.setFilter('vietnam-fill', null);
          map.setProperty('vietnam-fill', 'source-layer', realLayerName);
          map.setProperty('vietnam-line', 'source-layer', realLayerName);
        }
      });
    });

    // Hiện Popup tên tỉnh khi bấm vào
    map.on('click', 'vietnam-fill', (e) => {
      if (e.features.length > 0) {
        const props = e.features[0].properties;
        const name = props.ten_phuong || props.TEN_XA || props.NAME_2 || props.NAME_1 || props.name || props.ten_tinh || 'Ranh giới tỉnh';
        
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`<b style="font-size: 14px;">${name}</b>`)
          .addTo(map);
      }
    });

    map.on('mouseenter', 'vietnam-fill', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'vietnam-fill', () => map.getCanvas().style.cursor = '');
  </script>
</body>
</html>
