<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bản đồ Vector Việt Nam Siêu Nét</title>
  
  <!-- CSS MapLibre GL -->
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    #status {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="status">Đang tải bản đồ Vector...</div>
  <div id="map"></div>

  <!-- Thư viện MapLibre GL & PMTiles -->
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>

  <script>
    // 1. Khởi tạo plugin đọc PMTiles
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    // Điền ĐÚNG tên file .pmtiles bạn đã upload lên GitHub ở đây
    const PMTILES_URL = "34-Tinh-Thanh.pmtiles"; 

    const p = new pmtiles.PMTiles(PMTILES_URL);
    protocol.add(p);

    // 2. Khởi tạo bản đồ
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm-tiles': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap'
          },
          'vietnam-vector': {
            type: 'vector',
            url: `pmtiles://${PMTILES_URL}`
          }
        },
        layers: [
          // Nền OSM
          {
            id: 'osm-layer',
            type: 'raster',
            source: 'osm-tiles'
          },
          // Tô màu vùng ranh giới
          {
            id: 'vietnam-fill',
            type: 'fill',
            source: 'vietnam-vector',
            'source-layer': '34TinhThanh', // Tên layer bên trong pmtiles (thường là tên file viết liền)
            paint: {
              'fill-color': '#0066cc',
              'fill-opacity': 0.25
            }
          },
          // Vẽ đường viền ranh giới sắc nét
          {
            id: 'vietnam-line',
            type: 'line',
            source: 'vietnam-vector',
            'source-layer': '34TinhThanh',
            paint: {
              'line-color': '#ff3300',
              'line-width': 1.2
            }
          }
        ]
      },
      center: [108.0, 16.0],
      zoom: 5
    });

    map.on('load', () => {
      document.getElementById('status').textContent = 'Đã tải xong Vector Tiles siêu nét!';
    });

    // Hiện Popup khi bấm vào tỉnh/thành
    map.on('click', 'vietnam-fill', (e) => {
      if (e.features.length > 0) {
        const props = e.features[0].properties;
        const name = props.ten_phuong || props.TEN_XA || props.NAME_2 || props.NAME_1 || props.name || 'Ranh giới';
        
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`<b>${name}</b>`)
          .addTo(map);
      }
    });

    map.on('mouseenter', 'vietnam-fill', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'vietnam-fill', () => map.getCanvas().style.cursor = '');
  </script>
</body>
</html>
