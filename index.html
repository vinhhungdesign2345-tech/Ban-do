<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Đồ Quy Hoạch Cà Mau</title>

    <!-- MapLibre GL & TurfJS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>

    <!-- CSS Nội bộ -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="map-control">
        <h4>LỌC THEO KHU VỰC</h4>
        
        <!-- Dropdown 1: Tỉnh/Thành -->
        <label for="tinhFilter">Tỉnh / Thành phố:</label>
        <select id="tinhFilter">
            <option value="">-- Chọn Tỉnh --</option>
        </select>

        <!-- Dropdown 2: Phường/Xã -->
        <label for="phuongFilter" style="margin-top: 8px; display: block;">Phường / Xã / Thị trấn:</label>
        <select id="phuongFilter" disabled>
            <option value="">-- Chọn Phường/Xã --</option>
        </select>
    </div>

    <div id="map"></div>

    <!-- JS Mô-đun -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/filter.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
