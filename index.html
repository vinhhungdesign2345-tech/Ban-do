<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bản Đồ Quy Hoạch Cà Mau</title>

    <!-- Thư viện MapLibre GL (hiển thị bản đồ vector/raster mã nguồn mở) -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <!-- Thư viện TurfJS (thư viện xử lý không gian địa lý GIS) -->
    <script src="https://unpkg.com/@turf/turf/turf.min.js"></script>

    <!-- Liên kết tệp định dạng kiểu dáng CSS giao diện tùy chỉnh nội bộ -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Khung chứa các điều khiển bộ lọc và tìm kiếm đặt ở góc trái trên -->
    <div class="map-control">
        <div class="filter-row">
            <!-- Ô tìm kiếm thửa đất và nút bấm Tìm -->
            <div class="filter-item" style="width: 100%; display: flex; gap: 6px;">
                <input type="text" id="searchThuaDatInput" placeholder="Tìm theo tên, mã ĐD, tờ/thửa (VD: 7/29)..." style="flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;" />
                <button id="searchThuaDatBtn" style="padding: 8px 16px; background-color: #1a73e8; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; white-space: nowrap;">Tìm</button>
            </div>

            <!-- Dropdown 1: Lựa chọn Tỉnh / Thành phố -->
            <div class="filter-item">
                <select id="tinhFilter">
                    <option value="">-- Tỉnh / TP --</option>
                </select>
            </div>

            <!-- Dropdown 2: Lựa chọn Phường / Xã (mặc định bị khóa 'disabled' khi chưa chọn tỉnh) -->
            <div class="filter-item">
                <select id="phuongFilter" disabled>
                    <option value="">-- Phường / Xã --</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Thẻ div hiển thị toàn bộ khung bản đồ tương tác -->
    <div id="map"></div>

    <!-- Khung bảng panel hiển thị chi tiết thông tin thửa đất ở phía dưới màn hình -->
    <div id="parcel-info-panel" class="parcel-panel" style="display: none;">
        <div class="panel-header">
            <span><b>THÔNG TIN THỬA ĐẤT</b></span>
            <!-- Nút bấm dấu nhân (X) để đóng bảng thông tin, gọi hàm closeParcelPanel() -->
            <button onclick="closeParcelPanel()" class="close-btn">&times;</button>
        </div>
        <div id="panel-content" class="panel-body">
            <!-- Nội dung chi tiết các thuộc tính thửa đất sẽ được mã JavaScript đổ động vào đây -->
        </div>
    </div>

    <!-- Nút chuyển đổi nền bản đồ (Góc dưới bên trái hoặc tùy CSS) -->
    <div class="map-layer-control">
        <button id="toggleLayerBtn">Chuyển sang Bản đồ OSM</button>
    </div>

    <!-- 🎚️ KHUNG THANH TRƯỢT ĐỘ MỜ ĐẶT RIÊNG Ở GÓC PHẢI MÀN HÌNH -->
    <div id="opacity-control-panel" style="position: absolute; top: 60px; right: 10px; z-index: 10; background: white; padding: 10px; border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.2); width: 180px;">
        <label for="opacitySlider" style="font-size: 13px; display: block; margin-bottom: 4px; color: #333; font-weight: bold;">Độ mờ thửa đất: <span id="opacityValue">0.6</span></label>
        <input type="range" id="opacitySlider" min="0" max="1" step="0.05" value="0.6" style="width: 100%; cursor: pointer;">
    </div>

    <!-- Các tệp mã nguồn JavaScript mô-đun chức năng của ứng dụng -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sheet.js"></script>
    <script src="js/province.js"></script>
    <script src="js/searchThuaDat.js"></script>
    <script src="js/map.js"></script>
</body>
</html>
