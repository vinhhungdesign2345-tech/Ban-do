<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bản đồ GeoJSON Việt Nam</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    #status {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.9);
      padding: 10px 15px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      max-width: 300px;
    }
  </style>
</head>
<body>

  <div id="status">Đang quét danh sách file...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Thông tin repo lấy trực tiếp từ hình ảnh của bạn
    const GITHUB_OWNER = 'vinhhungdesign2345-tech';
    const GITHUB_REPO = 'Ban-do';
    const BRANCH = 'main';

    const statusEl = document.getElementById('status');
    const map = L.map('map').setView([16.047079, 108.206230], 6); // Trung tâm Việt Nam

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const geoGroup = L.featureGroup().addTo(map);

    const mapStyle = {
      color: "#0066cc",
      weight: 1.5,
      opacity: 0.8,
      fillColor: "#3399ff",
      fillOpacity: 0.25
    };

    async function loadAllGeoJSON() {
      try {
        // Tự động gọi API lấy toàn bộ danh sách file trong Repo
        const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/git/trees/${BRANCH}?recursive=1`;
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('Không thể lấy danh sách file từ GitHub API');
        
        const data = await res.json();
        const geojsonFiles = data.tree.filter(item => 
          item.type === 'blob' && item.path.toLowerCase().endsWith('.geojson')
        );

        if (geojsonFiles.length === 0) {
          statusEl.textContent = 'Không tìm thấy file .geojson nào!';
          return;
        }

        statusEl.textContent = `Tìm thấy ${geojsonFiles.length} file. Đang tải dữ liệu...`;

        let successCount = 0;

        // Tải tất cả các file GeoJSON tìm được
        await Promise.all(geojsonFiles.map(async (file) => {
          try {
            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${BRANCH}/${file.path}`;
            const geoRes = await fetch(rawUrl);
            const geoData = await geoRes.json();

            L.geoJSON(geoData, {
              style: mapStyle,
              onEachFeature: (feature, layer) => {
                if (feature.properties) {
                  const p = feature.properties;
                  const name = p.ten_phuong || p.TEN_XA || p.NAME_2 || p.NAME_1 || p.name || file.path;
                  layer.bindPopup(`<b>${name}</b>`);
                }
              }
            }).addTo(geoGroup);

            successCount++;
          } catch (e) {
            console.error('Lỗi tải file:', file.path, e);
          }
        }));

        statusEl.textContent = `Hoàn tất! Đã hiển thị ${successCount}/${geojsonFiles.length} tỉnh/thành.`;

        // Tự động zoom bản đồ bao trọn tất cả ranh giới
        if (geoGroup.getLayers().length > 0) {
          map.fitBounds(geoGroup.getBounds());
        }

      } catch (err) {
        statusEl.textContent = `Lỗi: ${err.message}`;
      }
    }

    loadAllGeoJSON();
  </script>
</body>
</html>
