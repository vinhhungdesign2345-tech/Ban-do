<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Hiển thị Ranh Giới GeoJSON</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    #log-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: white;
      padding: 10px 15px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      max-width: 300px;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <div id="log-panel"><b>Trạng thái tải file:</b><div id="logs"></div></div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // 1. Điền danh sách tên file GeoJSON của bạn ở đây
    const files = [
      'ranh-gioi.geojson',
      // 'phuong-xa.geojson', // Thêm các file khác vào đây...
    ];

    function log(msg, color = 'black') {
      const logs = document.getElementById('logs');
      logs.innerHTML += `<div style="color:${color}">${msg}</div>`;
    }

    // Khởi tạo bản đồ mặc định tại Việt Nam
    const map = L.map('map').setView([16.0, 108.0], 6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const geoGroup = L.featureGroup().addTo(map);

    // Kiểu dáng cho ranh giới phường xã (Đường viền đỏ, nền trong suốt)
    const myStyle = {
      color: "#ff3300",
      weight: 2,
      opacity: 0.8,
      fillColor: "#ff9900",
      fillOpacity: 0.2
    };

    // Tải toàn bộ file
    Promise.all(files.map(filePath => 
      fetch(filePath)
        .then(res => {
          if (!res.ok) throw new Error(`Không tìm thấy file (${res.status})`);
          return res.json();
        })
        .then(geoData => {
          // Thêm dữ liệu GeoJSON vào layer group
          const layer = L.geoJSON(geoData, {
            style: myStyle,
            onEachFeature: (feature, layer) => {
              // Hiển thị tên phường/xã khi click vào (nếu có property tên)
              if (feature.properties) {
                const props = feature.properties;
                const name = props.ten_phuong || props.TEN_XA || props.name || props.NAME || 'Ranh giới';
                layer.bindPopup(`<b>${name}</b>`);
              }
            }
          });
          
          geoGroup.addLayer(layer);
          log(`✓ Đã tải: ${filePath}`, 'green');
        })
        .catch(err => {
          log(`✗ Lỗi ${filePath}: ${err.message}`, 'red');
        })
    )).then(() => {
      // Sau khi tải xong tất cả file:
      if (geoGroup.getLayers().length > 0) {
        // Tự động căn chỉnh bản đồ zoom vừa khít với ranh giới
        const bounds = geoGroup.getBounds();
        if (bounds.isValid()) {
          map.fitBounds(bounds);
          log(`➜ Đã zoom đến vị trí ranh giới!`, 'blue');
        } else {
          log(`⚠️ Dữ liệu không có tọa độ hợp lệ!`, 'orange');
        }
      } else {
        log(`⚠️ Không có file nào được vẽ lên bản đồ.`, 'red');
      }
    });
  </script>

</body>
</html>
