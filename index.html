<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản đồ Vector Việt Nam - Mỗi Tỉnh Một Màu</title>
  
  <!-- CSS MapLibre GL -->
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    html, body, #map { 
      height: 100%; 
      margin: 0; 
      padding: 0; 
    }
    #status {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="status">Đang tải bản đồ...</div>
  <div id="map"></div>

  <!-- Thư viện MapLibre GL & PMTiles -->
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>

  <script>
    // 1. Đăng ký PMTiles Protocol
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const PMTILES_URL = "https://vinhhungdesign2345-tech.github.io/Ban-do/34-Tinh-Thanh.pmtiles"; 

    // Hàm tạo màu HSL ngẫu nhiên sinh động từ chuỗi chữ bất kỳ
    function stringToColor(str) {
      if (!str) return '#808080';
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const h = Math.abs(hash) % 360;
      return `hsl(${h}, 75%, 55%)`; // Màu HSL tươi sáng
    }

    // Các tên cột có thể chứa Tên Tỉnh trong file GeoJSON của bạn
    const PROVINCE_FIELDS = ['ten_tinh', 'NAME_1', 'name_1', 'Tinh', 'province', 'NAME_0'];

    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm-tiles': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap'
          },
          'vietnam-vector': {
            type: 'vector',
            url: `pmtiles://${PMTILES_URL}`
          }
        },
        layers: [
          { id: 'osm-layer', type: 'raster', source: 'osm-tiles' },
          
          // Layer Fill: Mặc định trong suốt ban đầu
          {
            id: 'vietnam-fill',
            type: 'fill',
            source: 'vietnam-vector',
            'source-layer': '34-Tinh-Thanh',
            paint: {
              'fill-color': '#0066cc',
              'fill-opacity': 0.5
            }
          },
          
          // Layer Viền: Viền xám mỏng nhạt để không bị rối mắt
          {
            id: 'vietnam-line',
            type: 'line',
            source: 'vietnam-vector',
            'source-layer': '34-Tinh-Thanh',
            paint: {
              'line-color': '#555555',
              'line-width': 0.5
            }
          }
        ]
      },
      center: [108.0, 16.0],
      zoom: 5
    });

    map.on('load', () => {
      document.getElementById('status').textContent = 'Đang tô màu từng tỉnh...';

      // 2. Sửa đúng source-layer từ metadata
      const p = new pmtiles.PMTiles(PMTILES_URL);
      p.getMetadata().then(meta => {
        let realLayerName = '34-Tinh-Thanh';
        if (meta.vector_layers && meta.vector_layers.length > 0) {
          realLayerName = meta.vector_layers[0].id;
          map.setProperty('vietnam-fill', 'source-layer', realLayerName);
          map.setProperty('vietnam-line', 'source-layer', realLayerName);
        }

        // 3. Tự động lấy tất cả tính năng trên màn hình để tạo bảng màu cho TỈNH
        map.once('idle', () => {
          const features = map.queryRenderedFeatures({ layers: ['vietnam-fill'] });
          
          if (features.length > 0) {
            // Tìm cột chứa tên tỉnh chuẩn nhất trong dữ liệu của bạn
            let targetField = null;
            const sampleProps = features[0].properties;
            for (const f of PROVINCE_FIELDS) {
              if (sampleProps[f] !== undefined) {
                targetField = f;
                break;
              }
            }

            // Nếu không tìm thấy cột tên tỉnh chuẩn, tự động lấy tên từ Popup làm chuẩn
            if (!targetField) {
              targetField = Object.keys(sampleProps)[0]; 
            }

            // Tạo biểu thức match màu cho từng tỉnh
            const colorMatch = ['match', ['get', targetField]];
            const provinceColors = {};

            features.forEach(f => {
              const provName = f.properties[targetField];
              if (provName && !provinceColors[provName]) {
                provinceColors[provName] = stringToColor(provName);
                colorMatch.push(provName, provinceColors[provName]);
              }
            });

            // Màu mặc định cho các vùng chưa tô
            colorMatch.push('#cccccc'); 

            // Áp dụng màu đa dạng từng tỉnh lên bản đồ
            map.setPaintProperty('vietnam-fill', 'fill-color', colorMatch);
          }

          document.getElementById('status').textContent = 'Đã hoàn tất tô màu mỗi tỉnh 1 màu!';
        });
      });
    });

    // Hiện Popup khi click vào
    map.on('click', 'vietnam-fill', (e) => {
      if (e.features.length > 0) {
        const props = e.features[0].properties;
        let name = 'Ranh giới';
        for (const key in props) {
          if (props[key] && typeof props[key] === 'string' && props[key].length > 1) {
            name = props[key];
            break;
          }
        }
        
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`<b style="font-size: 14px;">${name}</b>`)
          .addTo(map);
      }
    });

    map.on('mouseenter', 'vietnam-fill', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'vietnam-fill', () => map.getCanvas().style.cursor = '');
  </script>
</body>
</html>
