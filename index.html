<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản đồ Vector Cà Mau</title>
  
  <!-- CSS MapLibre GL -->
  <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    html, body, #map { 
      height: 100%; 
      margin: 0; 
      padding: 0; 
    }
    #status {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      padding: 8px 12px;
      border-radius: 6px;
      font-family: sans-serif;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div id="status">Đang tải bản đồ Cà Mau...</div>
  <div id="map"></div>

  <!-- Thư viện MapLibre GL & PMTiles -->
  <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@2.11.0/dist/index.js"></script>

  <script>
    // 1. Đăng ký protocol PMTiles
    const protocol = new pmtiles.Protocol();
    maplibregl.addProtocol("pmtiles", protocol.tile);

    const PMTILES_URL = "https://vinhhungdesign2345-tech.github.io/Ban-do/Ca-Mau.pmtiles"; 

    // 2. Khởi tạo bản đồ trực tiếp (không bắt trình duyệt chờ promise)
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'osm-tiles': {
            type: 'raster',
            tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap'
          },
          'camau-vector': {
            type: 'vector',
            url: `pmtiles://${PMTILES_URL}`
          }
        },
        layers: [
          // Lớp nền OpenStreetMap
          { id: 'osm-layer', type: 'raster', source: 'osm-tiles' },
          
          // Lớp tô màu các vùng Cà Mau
          {
            id: 'camau-fill',
            type: 'fill',
            source: 'camau-vector',
            'source-layer': 'Ca-Mau', // Tên layer mặc định
            paint: {
              'fill-color': [
                'interpolate',
                ['linear'],
                ['coalesce', ['id'], ['line-progress'], 1],
                0, '#1f77b4',
                5, '#aec7e8',
                10, '#ff7f0e',
                15, '#2ca02c',
                20, '#d62728',
                25, '#9467bd',
                30, '#8c564b'
              ],
              'fill-opacity': 0.6
            }
          },

          // Lớp viền trắng rõ nét
          {
            id: 'camau-line',
            type: 'line',
            source: 'camau-vector',
            'source-layer': 'Ca-Mau',
            paint: {
              'line-color': '#ffffff',
              'line-width': 1
            }
          }
        ]
      },
      center: [105.15, 9.18], // Tọa độ trung tâm Cà Mau
      zoom: 9.5
    });

    // 3. Xử lý khi bản đồ tải xong
    map.on('load', () => {
      document.getElementById('status').textContent = 'Đã tải xong bản đồ Cà Mau!';

      // Kiểm tra chính xác tên source-layer ngầm bên trong file để liên kết chuẩn
      const p = new pmtiles.PMTiles(PMTILES_URL);
      p.getMetadata().then(meta => {
        if (meta.vector_layers && meta.vector_layers.length > 0) {
          const realLayerName = meta.vector_layers[0].id;
          map.setProperty('camau-fill', 'source-layer', realLayerName);
          map.setProperty('camau-line', 'source-layer', realLayerName);
        }
      }).catch(err => console.log(err));
    });

    // Hiện thông tin Popup khi click vào từng vùng
    map.on('click', 'camau-fill', (e) => {
      if (e.features.length > 0) {
        const props = e.features[0].properties;
        const name = props.ten_phuong || props.TEN_XA || props.ten_xa || props.NAME_2 || props.NAME_1 || props.name || 'Cà Mau';
        
        new maplibregl.Popup()
          .setLngLat(e.lngLat)
          .setHTML(`<b style="font-size: 14px; color: #0066cc;">${name}</b>`)
          .addTo(map);
      }
    });

    map.on('mouseenter', 'camau-fill', () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', 'camau-fill', () => map.getCanvas().style.cursor = '');
  </script>
</body>
</html>
